# Packaging for install-free use: `uvx drift-detector run --root .` or `pipx install drift-detector`.
#
# The scan engine (ast-grep) is a PINNED dependency (ast-grep-cli==0.44.1) — the same version
# bin/drift-scan fetches — so an install brings the engine with it, no runtime download and no
# bootstrap. The installed package is READ-ONLY-SAFE: every write goes to the state dir or the
# $DRIFT_CATALOG_DIR overlay, never into the package. Determinism (CLAUDE.md principle 3) is by
# engine VERSION, so the pin is exact; bumping it is a ruleset re-verification event.
#
# bin/drift-scan stays the clone-and-run path; this is an additional, install-free one.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name (matches the GHCR image + the registered trusted publisher). "drift-detector"
# was blocked by PyPI's anti-typosquatting check; the console command stays `drift-scan`.
name = "drift-detector-scan"
version = "1.2.3"
description = "Deterministic, zero-LLM scanner for dying third-party API integrations: deprecated packages (CVE/EOL) and retired vendor APIs (sunsets), down to file:line."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tops Infosolutions Pvt Ltd" }]
keywords = ["deprecation", "api", "sunset", "cve", "eol", "sbom", "devsecops", "ast-grep", "scanner"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dependencies = [
  "PyYAML>=6.0",
  "ast-grep-cli==0.44.1",   # the scan engine — pinned; same version bin/drift-scan fetches
]

[project.scripts]
drift-scan = "agent.cli:_console"

[project.urls]
Homepage = "https://github.com/TOPSinfo/drift-detector-scan"
Repository = "https://github.com/TOPSinfo/drift-detector-scan"

[tool.setuptools.packages.find]
include = ["agent*"]
exclude = ["agent.eval*", "tests*"]   # eval corpus + tests are not runtime — keep the wheel lean

[tool.setuptools.package-data]
# the code loads these by __file__-relative path, so they MUST ship in the wheel:
#   agent/*.yaml            — the 6 catalogs (vendors, sunsets, idioms, frameworks, attestations, sdk_profiles)
#   agent/assets/**         — the vendored Vue runtime + dashboard template/css/js
agent = ["*.yaml", "assets/*", "assets/vendor/*"]
