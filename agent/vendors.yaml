# Vendor catalog — used to CLASSIFY discovered URL hosts (the scan finds all http(s) URLs; this
# labels the ones we recognize; the rest surface as "Unknown external").
# domains: a dotted value is matched as a registrable-domain SUFFIX (ebay.com -> api.sandbox.ebay.com);
#          a value with no dot is a distinctive host FRAGMENT (sellingpartnerapi -> regional Amazon hosts).
# Keep API-specific hosts (api.github.com, graph.facebook.com) where the bare domain is noisy.
# versionRegex: one capture group = the API version, applied to the URL (default covers /vN and dates).

# ── Marketplaces / e-commerce ──────────────────────────────────────────────
- { vendor: Amazon SP-API,     techKey: api:amazon-sp-api,       domains: [sellingpartnerapi] }
- { vendor: Amazon MWS,        techKey: api:amazon-mws,          domains: [mws.amazonservices.com] }
- { vendor: Amazon Ads API,    techKey: api:amazon-ads,          domains: [advertising-api] }
- { vendor: eBay,              techKey: api:ebay,                domains: [ebay.com] }
- { vendor: Walmart,           techKey: api:walmart-marketplace, domains: [walmartapis.com] }
- { vendor: Etsy,              techKey: api:etsy,                domains: [etsy.com] }
# pathSignature: the Admin API path `/admin/api/{YYYY-MM}/` is host-independent — merchant
# calls build the host at runtime (`https://{$shop}/admin/api/2024-01/…`), so host matching is
# blind but this path is Shopify and nothing else. Group 1 = the calendar version, which
# version_lifecycle dates (2024-01 → retired 2025-01-16). Source: shopify.dev/docs/api/admin.
- { vendor: Shopify,           techKey: api:shopify,             domains: [myshopify.com, shopify.dev], pathSignature: '/admin/api/([0-9]{4}-[0-9]{2})/' }
- { vendor: BigCommerce,       techKey: api:bigcommerce,         domains: [bigcommerce.com] }
- { vendor: WooCommerce,       techKey: api:woocommerce,         domains: [woocommerce.com] }
- { vendor: Mirakl,            techKey: api:mirakl,              domains: [mirakl.net] }
- { vendor: Virtualstock,      techKey: api:virtualstock,        domains: [virtualstock.com] }  # Harvey Norman marketplace (Virtualstock 'The Edge')
- { vendor: Rakuten,           techKey: api:rakuten,             domains: [rakuten.com, rms.rakuten.co.jp] }
# AU/NZ marketplaces — DETECTION ONLY (host match; default version format). Evidence: seen as
# live API hosts in marketplacehub/marketplacehub-api's marketplace controllers (sandbox/preprod/api
# subdomains). These are UNAUDITED — no retirement list has been checked yet, so a scan will
# name the integration but must NOT imply its versions are current. Retirements enter later,
# each from a fetched source (never invent a date). Harvey Norman is used here too but its host
# is fully config-driven (no URL literal), so it is not host-detectable — left honestly blind.
- { vendor: MyDeal,            techKey: api:mydeal,              domains: [mydeal.com.au] }
- { vendor: THE ICONIC,        techKey: api:theiconic,           domains: [theiconic.com.au] }
- { vendor: TheMarket,         techKey: api:themarket,           domains: [themarket.co.nz] }
- { vendor: Kogan,             techKey: api:kogan,               domains: [kgn.io] }
- { vendor: Tradevine,         techKey: api:tradevine,           domains: [api.tradevine.com] }
- { vendor: Trade Me,          techKey: api:trademe,             domains: [api.trademe.co.nz] }
- { vendor: Catch,             techKey: api:catch,               domains: [catch.com.au] }
- { vendor: Magento,           techKey: api:magento,             domains: [] }   # self-hosted; identified by the /rest/V1 path-constant idiom, not a host
- { vendor: MySale,            techKey: api:mysale,              domains: [mysalemarketplace.com] }
- { vendor: Marketplacer,      techKey: api:marketplacer,        domains: [marketplacer.com] }
- { vendor: Mirakl,            techKey: api:mirakl,              domains: [mirakl.net] }
- { vendor: Virtualstock,      techKey: api:virtualstock,        domains: [virtualstock.com] }  # Harvey Norman marketplace (Virtualstock 'The Edge')

