  source: https://www.edp.ebay.com/rss/api-deprecation#GetSellerDiscountProfiles
  note: Trading API. Deprecated 2026-06-10, decommissioned 2027-01-19.
- vendor: eBay
  operation: SetShippingDiscountProfiles
