  source: https://www.edp.ebay.com/rss/api-deprecation#getProductDetails
  note: Product API. Deprecated 2026-05-26, decommissioned 2026-08-15.
- vendor: eBay
  operation: updatePaymentInfo
  retires: '2026-06-02'
  source: https://www.edp.ebay.com/rss/api-deprecation#updatePaymentInfo
  note: Order v1 API. Deprecated 2026-05-18, decommissioned 2026-06-02.
- vendor: eBay
  operation: GetSellerDiscountProfiles
