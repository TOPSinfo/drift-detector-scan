# ── AU/NZ marketplaces (MyDeal, THE ICONIC, TheMarket, Kogan) — RESEARCHED 2026-07-29, NO ENTRY.
# Detected in marketplacehub/marketplacehub-api (catalogued for detection in vendors.yaml). Retirement
# research found NO sourced, catalogable sunset date for any, so nothing is added — no source =
# no entry (a borrowed or invented date is worse than none). Accessibility DIFFERS per vendor
# (corrected after a direct check — do not re-lump them as "all behind login"):
#   • Kogan — PUBLIC changelog (https://developers.kogan.com/changelog). CHECKED: it uses relative
#     timestamps ("over 5 years ago"), announces additions (Orders API on v2), and its one
#     deprecation (select-category-by-name → use IDs) is UNDATED and field-level — not a
#     version/host/path the endpoint model can join on. Nothing catalogable, but publicly verified.
#     (Caveat: the changelog is a JS-rendered SPA; a human render may surface entries a fetch cannot.)
#   • THE ICONIC — CONFIRMED login-gated: the docs page (https://sellercenter-api.theiconic.com.au/docs/)
#     says "Sign in to access the full documentation." The Lazada Seller Center decommissions
#     (https://lazada-sellercenter.readme.io/docs/announcement, "out of support 2018-05-31") are
#     LAZADA SEA ventures, NOT THE ICONIC (Australia, a different GFG instance) — misattribution refused.
#   • MyDeal — CONFIRMED docs-by-request: sellerhelp.mydeal.com.au states "submit a request to enquire
#     about receiving the latest API documentation." Not public.
#   • TheMarket (NZ) — no public API docs found (integrates via middleware: Omnivore/Cresco/ChannelAdvisor);
#     not proven a hard login wall, just no public source.
# All four stay DETECTED but UNAUDITED (honest: we name the integration, we do not claim its versions
# are current). THE ICONIC/MyDeal/TheMarket need SELLER-PORTAL material (a dated deprecation notice +
# its origin = a valid source); Kogan is public and simply has nothing dated to catalog.

# ── eBay — absorbed 2026-07-29 from the deprecation RSS (the freshness loop's first live catch).
# The monthly catalog-check stage (run 2026-07-29) diffed the live feed against this catalog and
# flagged ONE new retirement the vendor lists that we lacked. The feed was re-fetched the same
# session and the item re-read before staging (never a remembered date); entered via
# `drift-scan absorb` (staging + gate), not a direct edit. Vendor wording: "GetAdFormatLeads has
# been deprecated and will be decommissioned on September 21, 2026. Current users should migrate
# to the REST Leads API."
- vendor: eBay
  operation: GetAdFormatLeads
  retires: '2026-09-21'
  replacement: the REST Leads API
  source: https://www.edp.ebay.com/rss/api-deprecation#GetAdFormatLeads
  note: Trading API. Deprecated 2026-07-02, decommissioned 2026-09-21. First live
    catch of the monthly catalog-check stage (flagged by the 2026-07-29 run); feed
    re-fetched and the item re-read at absorb time, same session.

# ── Platform shutdowns (whole-marketplace retirements) — an integration to a dead platform is
# 100% broken, not "deprecated someday". First parties are GONE, so these are trade-press
# sourced (flagged below); a shutdown is the one case where the vendor page can't be the cite.
- vendor: Catch
  version: "*"
  retires: "2025-04-30"
  source: https://ia.acs.org.au/article/2025/catch-com-au-to-close-down.html
  note: >-
    Catch (catch.com.au, Wesfarmers) ceased operating 2025-04-30 — entire marketplace shut
    down; ran on Mirakl. Trade-press sourced (ACS/SmartCompany) — first-party site is gone.
- vendor: MySale
  version: "*"
  retires: "2026-01-27"
  source: https://powerretail.com.au/breaking-ozsale-announces-closure/
  note: >-
    MySale/OZSale closed all sites + operations 2026-01-27 (NZSale earlier, 2025-11-23). The
    API domain is DNS-dead. Trade-press sourced (PowerRetail/Medcart) — first party is gone.
- vendor: MyDeal
  version: "*"
  retires: "2025-09-30"
  source: https://insideretail.com.au/sectors/woolworths-to-close-mydeal-online-marketplace-in-digital-business-refocus-202506
  note: >-
    MyDeal (mydeal.com.au, Woolworths Group) marketplace closed 2025-09-30 (announced
    2025-06-27; consolidated into BIG W Market — mydeal.com.au now redirects to BigW). Trade
    press sourced (Inside Retail / Mi3); seller API help domain is DNS-dead.
