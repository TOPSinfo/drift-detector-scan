- { package: npm/stripe,                         vendor: Stripe,        host: api.stripe.com }

# ── Commerce / Shopify ───────────────────────────────────────────────────────────────────
# Wrappers assemble https://{shop}.myshopify.com — no host literal. Package presence is the
# evidence (same as twilio/sdk). Host is the catalogued Shopify domain so coverage joins.
- { package: composer/shopify/shopify-api,       vendor: Shopify,       host: myshopify.com }
- { package: composer/gnikyt/basic-shopify-api,  vendor: Shopify,       host: myshopify.com }
- { package: composer/phpclassic/php-shopify,    vendor: Shopify,       host: myshopify.com }
- { package: composer/shopifyextras/shopify-php-api-wrapper, vendor: Shopify, host: myshopify.com }
- { package: composer/kyon147/laravel-shopify,   vendor: Shopify,       host: myshopify.com }

# ── AI providers ─────────────────────────────────────────────────────────────────────────
- { package: composer/openai-php/client,         vendor: OpenAI,        host: api.openai.com }
- { package: composer/openai-php/laravel,        vendor: OpenAI,        host: api.openai.com }
- { package: npm/openai,                          vendor: OpenAI,        host: api.openai.com }
# The PHP client. Only the npm package was mapped, so a composer repo depending on this was
# never classified as calling Anthropic — and with no host literal in its code, the claude-*
# model ids it pins had nothing to corroborate them either. Found on a real corpus repo.
- { package: "composer/anthropic-ai/sdk",       vendor: Anthropic,     host: api.anthropic.com }
- { package: "npm/@anthropic-ai/sdk",            vendor: Anthropic,     host: api.anthropic.com }

# ── Marketplace / Amazon SP-API (Go) ─────────────────────────────────────────────────────
# A consumer repo requires one of these in go.mod but holds NO SP-API path literals of its
# own — the paths live in the module cache, which is not scanned. The dependency IS the
# evidence, exactly as for composer/twilio/sdk. This is the complement of the shipped
# `spapi-operation-paths` idiom, which needs the paths to be in-tree.
- { package: go/github.com/amzapi/selling-partner-api-sdk, vendor: Amazon SP-API, host: sellingpartnerapi-na.amazon.com }
