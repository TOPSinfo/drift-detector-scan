# Idiom instances — how code in the wild ASSEMBLES an API call.
#
# Detection has two layers with opposite goals. Attribution must be precise, so it
# is idiom-by-idiom; the coverage conscience must be general, so it keys on evidence
# (a path literal is left behind whatever wraps it). This file is the growing half:
# each entry teaches the scanner one more shape.
#
# FAMILIES ARE A CLOSED SET, implemented once in agent/lib/idioms.py. Instances are
# data, so an agent can propose one and a human can review it as a YAML diff. A new
# FAMILY is a code change and a pull request — the docs say so plainly rather than
# pretending absorption is unbounded.
#
#   url-assembly     a base host/URL expression concatenated with a path
#                    -> `base` is an ast-grep pattern for the base expression
#   url-append       a base assigned, then a path APPENDED with `.=` two statements
#                    later — url-assembly's single-expression `base . $B` cannot see it
#                    -> `target` names the variable literally (a metavariable would
#                       match every string append in the codebase)
#   operation-marker names the API operation at the call-site, for vendors that
#                    deprecate per-operation (eBay Trading: one host, ~19 calls)
#                    -> `marker` (regex over string literals) or `pattern`
#
# Every instance MUST carry `evidence`: a real file:line it was derived from. An
# idiom nobody can point at in real code is a guess.

- id: php-gethost-method
  family: url-assembly
  language: php
  base: "$A->getHost()"
  evidence: "example-org/amazonspapi src/Api/OrdersApi20260101.php:46"
  note: Generated SP-API clients — $url = $this->config->getHost() . $resource_path.

- id: php-serviceurl-property
  family: url-assembly
  language: php
  base: "$A->serviceUrl"
  evidence: "example-org/ebayapi src/Ebay/FetchReturnOrders.php:72"
  note: eBay Post-Order client — $service_url = $this->serviceUrl . '/post-order/v2/'.

- id: xml-request-root
  family: operation-marker
  marker: "<[A-Z][A-Za-z0-9]{2,}Request\\b"
  evidence: "example-org/ebayapi src/Ebay/EbayCategoryFieldsFeature.php:72"
  note: SOAP/XML APIs name the operation in the request root element.

- id: ebay-session-call-name
  family: operation-marker
  language: php
  pattern: "getEbaySession($NAME, $$$)"
  evidence: "example-org/ebayapi src/Ebay/EbayCategoryFieldsFeature.php:24"
  note: The call name passed to the session helper becomes X-EBAY-API-CALL-NAME.

- id: php-serviceurl-append
  family: url-append
  language: php
  target: serviceURL
  evidence: "example-org/ebayapi src/Ebay/EbayOrderReturn.php:35"
  note: >-
    eBay Post-Order clients assign the base then append the path two statements later
    ($serviceURL = $this->API_ENDPOINT; ... $serviceURL .= $params['url'];), which the
    single-expression url-assembly family cannot express.

- id: php-api-endpoint-property
  family: url-assembly
  language: php
  base: "$A->API_ENDPOINT"
  evidence: "example-org/ebayapi src/Ebay/src/Ebay_post_order_api.php:64"
  note: eBay Post-Order procedural client — $url = $this->API_ENDPOINT . "post-order/v2/...".

- id: js-baseurl-concat
  family: url-assembly
  language: javascript
  base: "$A.baseURL"
  evidence: "tests/fixtures/idioms/js-baseurl-concat.js:16"
  note: >
    JS clients store the host on the instance and build the path onto it, so the host
    never shares a string literal with the path and a URL-literal scan sees only a
    versioned path with no vendor. JavaScript concatenates with `+`; the PHP instances
    above compile to `.` from the same family.

    This ONE instance emits BOTH JS/TS shapes, because they are the same idiom written two
    ways and share this `base`:
      `$A.baseURL + $B`        -> tests/fixtures/idioms/js-baseurl-concat.js:16
      `` `${$A.baseURL}$$$B` `` -> tests/fixtures/idioms/js-baseurl-template.js:16
    The template form is a template_string node, invisible to the `+` rule — that second
    fixture is kept precisely to prove the `+` pattern matches it zero times. A separate
    instance for it would compile to the identical two patterns and buy nothing.


- id: js-axios-create
  family: client-base
  language: javascript
  pattern: "axios.create({baseURL: $B})"
  evidence: "tests/fixtures/idioms/js-axios-create.js:12"
  note: >
    The host is handed to a client factory once and every later call passes only a path
    (`api.get('/v1/charges')`), so the host and the path never share an expression and both
    url-assembly rules match this shape zero times. The file still carries the host as a URL
    literal, so a vendor IS classified; what was missing is any signal that the file
    assembles URLs, which endpoints.py requires before attributing a bare path literal.
    This marks the file. It does not pair create() with the later .get() — no dataflow is
    claimed, and a create() in a different file from the call remains a miss.

    KNOWN MISS: extra option keys. `axios.create({baseURL, timeout})` is not matched — the
    pattern requires baseURL to be the sole key. `axios.create($OPTS)` would reach it and is
    clean against Object.create, but drops the baseURL requirement, so a client created with
    no base would mark its file as assembling and bare paths there would be attributed to
    whatever host the file mentions. Manufacturing attributions is worse than this gap.

- id: py-httpx-client
  family: client-base
  language: python
  pattern: "httpx.$M(base_url=$B)"
  evidence: "tests/fixtures/idioms/py-httpx-client.py:12"
  note: >
    The Python spelling of js-axios-create: the host goes to a client factory once and
    every later call passes only a path, so the host and the path never share an
    expression and nothing emits path-assembly. The file still classifies a vendor from
    the host literal; what was missing is the signal that it assembles URLs at all. Marks
    the file only — no pairing of the factory with the later .get(), no dataflow claimed.

    `$M` covers Client and AsyncClient from one instance. That was decided from engine
    output, not preference: it matches both (2 hits) and matches none of the negative
    controls, because requiring the `base_url=` keyword is what excludes `httpx.get(...)`,
    a local class named Client, requests.Session, and a bare `httpx.Client()` holding no
    host.

    KNOWN MISS: extra kwargs. `httpx.Client(base_url=..., timeout=10.0)` is not reached —
    the pattern requires base_url to be the sole argument. Widening to `httpx.$M($$$)`
    would reach it but drops the base_url requirement, so a client holding no host would
    mark its file as assembling and bare paths there would be attributed to whatever host
    the file mentions. Same ruling as the axios instance.
    KNOWN MISS: `from httpx import Client; Client(base_url=...)` — no `httpx.` prefix.

- id: py-base-url-concat
  family: url-assembly
  language: python
  base: "$A.base_url"
  evidence: "tests/fixtures/idioms/py-base-url-concat.py:19"
  note: >
    Python concatenates with `+`. Until this instance the family emitted NOTHING for
    python — _CONCAT_OP knew php/javascript/typescript only, and to_rules skips a language
    it has no operator for — so a Python client that assembles URLs looked exactly like a
    repo with nothing to find.

    KNOWN MISS: f-strings. `f"{self.base_url}/v1/charges"` is a different AST node and
    matches this rule zero times. Python is deliberately absent from _TEMPLATE_LANGS: the
    JS template pattern is backtick syntax, not an f-string, and copying it here would ship
    a rule that can never match.
    KNOWN MISS: `self.baseURL + path` — no case-folding, same ruling as JS baseUrl.
