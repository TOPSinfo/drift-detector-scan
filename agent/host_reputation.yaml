# Deterministic host reputation — triages UNCATALOGUED egress hosts into a visible hostClass so the
# cockpit can show found integrations as a SUCCESS (breadth is the value) and keep bundled
# assets/libraries/schemas out of the integration total. It NEVER affects classified/vendor/dates.
#
# Hand-curated, reviewed data — NO imported blocklist (see the plan's "Decision: no imported
# blocklist"): a public tool ships no third-party list's licensing obligations, and this set is small
# enough to own by hand. A tracker that ALSO ships a real, versioned API (segment, mixpanel,
# intercom, amplitude, …) is deliberately LEFT OUT so it stays attention-worthy (api-lead /
# unclassified) rather than pre-buried in `analytics`. If one is ever tracked it goes in vendors.yaml.
#
# Keys are hostClass values. A dotted entry matches as a registrable-domain SUFFIX, so prefer a
# SPECIFIC host (images.unsplash.com) when the bare domain (unsplash.com) has a real API worth surfacing.

# ── Integration classes: SHOWN as found integrations (analytics + social are still third-party) ─────
analytics:          # PURE trackers / tag managers / session recorders (no first-class API we audit)
  - connect.facebook.net
  - static.hotjar.com
  - hotjar.com
  - google-analytics.com
  - googletagmanager.com
  - clarity.ms
  - fullstory.com
social-widget:      # share / embed / follow / messaging destinations
  - wa.me
  - whatsapp.com
  - pinterest.com
  - tiktok.com
  - x.com
  - twitter.com
  - facebook.com
  - instagram.com
  - linkedin.com
  - youtube.com
  - youtu.be
  - fb.me                 # Facebook's short-link host — a share/profile link, never an API
  - snapchat.com
  - threads.net
  - soundcloud.com        # embedded player/profile links; SoundCloud's real API is api.soundcloud.com,
                          # which the `api.` host-label rule still catches as a lead

# ── Non-integration classes: EXCLUDED from the integration total (shown under "assets & libraries") ─
asset-cdn:          # fonts, icons, images, generic static-asset CDNs — not a service the app calls
  - lorempixel.com
  - cloudflare.com
  - static.arcgis.com
  - maxcdn.com
  - fonts.googleapis.com
  - fonts.gstatic.com
  - gstatic.com
  - fonts.bunny.net
  - cdnjs.cloudflare.com
  - bootstrapcdn.com
  - jsdelivr.net
  - unpkg.com
  - kwcdn.com
  - images.unsplash.com
  - gravatar.com
  - placehold.co
  - placeholder.com
  - via.placeholder.com
  - picsum.photos
  - flagcdn.com
  - get.adobe.com         # the "Get Acrobat Reader" download badge — an outbound link, not a service
  # Marketplace product-image CDNs. Both are DEDICATED image hosts on their own registrable
  # domains — the vendors' real APIs live elsewhere (sellingpartnerapi-*.amazon.com, api.ebay.com)
  # and are untouched by these entries. Between them they were 225 of the 925 queued call sites
  # on the 2026-09-01 fleet scan, the largest single block of "unresolved integrations" in it.
  - ssl-images-amazon.com  # images-na.ssl-images-amazon.com — image URLs built from Keepa tokens
  - ebayimg.com            # i.ebayimg.com — listing images in the product-posting path
  - flagpedia.net          # flag images; sibling of flagcdn.com already listed above
vendored-lib:       # front-end libraries / UI kits the app bundles or links its own copy of
  - quilljs.com
  - leafletjs.com
  - handlebarsjs.com
  - sweetalert2.github.io
  - tiny.cloud
  - svgjs.dev
  - amcharts.com
  - keenthemes.com
  - momentjs.com
  - jquery.com
  - jqueryui.com
  - getbootstrap.com
  - popper.js.org
  - ckeditor.com
  - cksource.com
  - feathericons.com
  - datatables.net
  - fullcalendar.io
  - apexcharts.com
  - tinymce.com
  - select2.org
  # PHPExcel's own site, linked from the library's HTML writer and examples. The library is
  # vendored into the tree it was found in, so this is a bundled copy's homepage, not a service.
  - phpexcel.net
boilerplate:        # schema / namespace / doc / code hosts — links & namespaces, never a runtime integration
  - www.esri.com
  - google.com
  - www.amazon.com
  # Seller Central is the merchant PORTAL. It appears in code as a `seller_central_link`
  # rendered into the UI for a human to click — never called. Sits beside www.amazon.com,
  # which is here for the same reason.
  - sellercentral.amazon.com
  - sellercentral.amazon.com.au
  - www.walmart.com
  - open.spotify.com
  - esriurl.com
  - openxmlformats.org
  # ODF XML namespace declarations in PHPExcel's OpenDocument writer — a namespace URI is not
  # fetched at runtime. Sits beside openxmlformats.org, which is here for the same reason.
  - openoffice.org
  - schemas.microsoft.com
  - ietf.org
  - github.io
  - w3.org
  - schema.org
  - json-schema.org
  - xmlsoap.org
  # Documentation and raw-source hosts found in the fleet's resolution queue, where they sat
  # as "unresolved integrations" nobody could resolve — there is nothing to resolve about a
  # link to curl's manual. Each is a DIFFERENT registrable domain from a sibling already
  # covered elsewhere: githubusercontent.com is not github.com, amazonwebservices.com is not
  # amazonaws.com (which is deliberately absent — that is the real AWS API domain).
  - haxx.se
  - guzzlephp.org
  - githubusercontent.com
  - amazonwebservices.com
  - purl.org
  - apache.org
  - iso.org
  - sitemaps.org
  - gmpg.org
  - github.com
  - gitlab.com
  - bitbucket.org
  - php.net
  - laravel.com
  - laracasts.com
  - symfony.com
  - npmjs.com
  - packagist.org
  - getcomposer.org
  - wordpress.org
  - readthedocs.io
  - mozilla.org
  - nodejs.org
  - python.org
  - macromedia.com
  - ebaystatic.com
  # ── spec / documentation hosts. These reached the QUEUE on a real scan and were described as
  # "an API service we haven't researched yet"; rfc-editor.org was already excluded elsewhere,
  # so the tool disagreed with itself about the same domain.
  - spdx.org              # SPDX licence identifiers, cited in SBOM/licence headers
  - spec.openapis.org     # OpenAPI spec URLs in swagger annotations
  - rfc-editor.org        # RFC citations, same family as the already-listed ietf.org
  - reactjs.org           # framework docs linked from scaffolding comments
  - redux.js.org
  - vladimirgorej.com     # author homepage in a vendored swagger-client's headers
  - acme.com              # placeholder org name in generated docs/fixtures. NOT dropped via
                          # classify_url._PLACEHOLDER: it is a REAL registrable domain, so a
                          # genuine call to it must stay visible rather than silently vanish.
  # ── F4: RFC 2606 / RFC 6761 reserved TLDs. These used to be hard-dropped in
  # classify_url._PLACEHOLDER on the theory that "nothing resolves behind them" makes dropping
  # honest — but dropping still makes the host disappear from the inventory, and a reserved-TLD
  # host found in real code (`cdn.example.test`) is still evidence the scan should show. Bare
  # entries match by suffix the same way a dotted one does (host_class._reputation strips labels
  # front-to-back), so `test` alone covers every `*.test` host.
  - test
  - example
  - invalid
