# Deterministic host reputation — triages UNCATALOGUED egress hosts into a visible hostClass so the
# cockpit can show found integrations as a SUCCESS (breadth is the value) and keep bundled
# assets/libraries/schemas out of the integration total. It NEVER affects classified/vendor/dates.
#
# Hand-curated, reviewed data — NO imported blocklist (see the plan's "Decision: no imported
# blocklist"): a public tool ships no third-party list's licensing obligations, and this set is small
# enough to own by hand. A tracker that ALSO ships a real, versioned API (segment, mixpanel,
# intercom, amplitude, …) is deliberately LEFT OUT so it stays attention-worthy (api-lead /
# unclassified) rather than pre-buried in `analytics`. If one is ever tracked it goes in vendors.yaml.
#
# Keys are hostClass values. A dotted entry matches as a registrable-domain SUFFIX, so prefer a
# SPECIFIC host (images.unsplash.com) when the bare domain (unsplash.com) has a real API worth surfacing.

# ── Integration classes: SHOWN as found integrations (analytics + social are still third-party) ─────
analytics:          # PURE trackers / tag managers / session recorders (no first-class API we audit)
  - connect.facebook.net
  - static.hotjar.com
  - hotjar.com
  - google-analytics.com
  - googletagmanager.com
  - clarity.ms
  - fullstory.com
social-widget:      # share / embed / follow / messaging destinations
  - wa.me
  - whatsapp.com
  - pinterest.com
  - tiktok.com
  - x.com
  - twitter.com
  - facebook.com
  - instagram.com
  - linkedin.com
  - youtube.com
  - youtu.be
  - fb.me                 # Facebook's short-link host — a share/profile link, never an API
  - snapchat.com
  - threads.net
  - soundcloud.com        # embedded player/profile links; SoundCloud's real API is api.soundcloud.com,
                          # which the `api.` host-label rule still catches as a lead

# ── Non-integration classes: EXCLUDED from the integration total (shown under "assets & libraries") ─
asset-cdn:          # fonts, icons, images, generic static-asset CDNs — not a service the app calls
