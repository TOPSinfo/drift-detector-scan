# Documentation site — https://topsinfo.github.io/drift-detector-scan/
#
# `nav` curates the SIDEBAR only. Every file under docs/ still builds — so existing relative
# links keep resolving — and, VERIFIED against the generated search_index.json, off-nav pages
# ARE returned by site search: the tech-debt register, the positioning brief, and everything
# under docs/superpowers/ are all findable. That is a deliberate, accepted choice (those files
# are already public in the repo, and tests/test_no_internal_identifiers.py keeps client names
# out of the tree on every change) — but it is NOT concealment, so do not describe it as such.
#
# To genuinely keep a page out of the build and the search index, use MkDocs' `exclude_docs:`
# rather than merely leaving it out of `nav`. Omitting it from `nav` hides it from the sidebar
# and nothing else.
site_name: Drift Detector
site_description: Know before it breaks — find dying third-party API integrations down to file:line.
site_url: https://topsinfo.github.io/drift-detector-scan/
repo_url: https://github.com/TOPSinfo/drift-detector-scan
repo_name: TOPSinfo/drift-detector-scan
edit_uri: edit/master/docs/

theme:
  name: material
  # The TOPS mark in the header. Vendored under docs/assets/ rather than hot-linked:
  # the site must build and render with no network, and an upstream path change must
  # not silently blank the logo.
  # White mark for the coloured header bar — the source mark is TOPS cyan (#27AAE1),
  # which is exactly the header colour, so the original was invisible there. The
  # favicon keeps the real cyan, since it sits on the browser's own background.
  logo: assets/tops-mark-white.svg
  favicon: assets/tops-menu_sm.svg
  palette:
    # ember-crimson is the product accent (see CLAUDE.md § Branding)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

# Generates /llms.txt and /llms-full.txt from the build's own file set, so the "Ask Claude"
# button has something to read. Derived from `files`, never from a hand-kept list — see the
# module docstring: a manifest would re-publish the pages `exclude_docs` just removed.
hooks:
  - docs/hooks/llms_txt.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  # Adds "Ask Claude about this page" under each page title, pointed at that page plus
  # the generated llms-full.txt. Progressive enhancement: with JS off the docs are
  # unchanged, and the hero button (plain markup) still works.
  - javascripts/ask-claude.js

markdown_extensions:
  - admonition
  - attr_list
  # the landing hero is HTML wrapping markdown (buttons, links); without this the
  # markdown inside those divs renders literally
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      # Mermaid renders client-side from a ```mermaid fence. Material ships the integration;
      # no extra plugin, and the diagram source stays reviewable text in the markdown rather
      # than a binary image nobody can diff.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Reading the report: reading-the-report.md
  - FAQ: FAQ.md
  - Glossary: glossary.md
  - Changelog: changelog.md
  - Use it:
      - Claude Code plugin: PLUGIN.md
  - Build it:
      - How it stays honest: how-it-stays-honest.md
      - Teaching it a new shape: drift-absorb.md
      - Evaluating the scanner: EVAL.md
  - Where it's going:
      - Roadmap: ROADMAP.md

# A page that exists but is not in `nav` is built and linkable, and MkDocs would otherwise warn
# on every one of them. Internal docs are intentionally off-nav, so silence that specific warning
# rather than dropping the files (which would break inbound links from the repo and CHANGELOG).
# Internal engineering material: kept in the repo (code comments in agent/resolve.py, run.py and
# cli.py cite these specs as the design rationale for the no-queue gate — that trail is the
# project's memory and deleting it would break real references), but NOT published to the site.
# A customer searching the docs should not surface planning trails or internal positioning notes.
exclude_docs: |
  hooks/
  superpowers/
  PUBLIC-POSITIONING-CLAUDE.md
  POC-ADHOC-SHAPES.md
  FRONTEND-PLANE.md
  NAVIGATOR-WORKER.md

validation:
  nav:
    omitted_files: ignore
  links:
    absolute_links: ignore
    unrecognized_links: ignore

copyright: Built by <a href="https://www.topsinfosolutions.com/">TOPS Infosolutions</a>
