# Drift Detector — scheduled integration-drift scan.
#
# Installed by `/drift-detector onboard`. Add this job to your `.gitlab-ci.yml` (or use it as the
# whole file). The scan is billed to the ANTHROPIC_API_KEY CI/CD variable (masked + protected) set
# on THIS project — the key lives only in GitLab CI/CD settings, NEVER in this file.
#
# Cadence is a *pipeline schedule* (Build → Pipeline schedules), created by onboard; the rules below
# make the job fire only on scheduled or manual (web) runs, never on every push. The scan target
# is filled in by onboard.
drift-detector:
  image: node:20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - npm install -g @anthropic-ai/claude-code
    - claude plugin marketplace add TOPSinfo/drift-detector-scan
    - claude plugin install drift-detector@tops-tools
    - claude -p "/drift-detector __FLEET__" --permission-mode bypassPermissions
    - mkdir -p cockpit && cp -r "$HOME/.drift-detector/"*/ cockpit/ 2>/dev/null || true
  artifacts:
    paths: [cockpit/]
    expire_in: 30 days
