# Publish the package to PyPI on a version tag, so `uvx drift-detector` / `pipx install
# drift-detector` work with no git URL.
#
# Auth is PyPI TRUSTED PUBLISHING (OIDC) — no API token is stored anywhere. One-time setup on
# PyPI is required before the first run: see docs/PUBLISHING.md. Every third-party action is
# SHA-pinned (enforced by tests/test_github_scan_workflow.py), and the upload carries PEP 740
# build attestations.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi          # match this name in the PyPI trusted-publisher config (docs/PUBLISHING.md)
    permissions:
      contents: read           # checkout needs read access — REQUIRED once the repo is private
                               # (a job `permissions:` block REPLACES the workflow default, so the
                               # top-level `contents: read` does not carry into this job on its own)
      id-token: write          # PyPI Trusted Publishing (OIDC) — no stored token
      attestations: write      # PEP 740 attestations on the uploaded artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262            # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065        # v5
        with:
          python-version: "3.12"

      # never publish a red build — a tag push does NOT trigger ci.yml (tags aren't branches)
      - name: Test
        run: |
          python -m pip install -q pytest "PyYAML>=6.0" jsonschema "ast-grep-cli==0.44.1"
          python -m pytest -q

      - name: Tag must match the pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pv=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag  pyproject=$pv"
          test "$tag" = "$pv" || { echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pv"; exit 1; }

      - name: Build sdist + wheel
        run: |
          python -m pip install -q --upgrade build
          python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          # PEP 740 attestations use GitHub's attestation store, which is unavailable for
          # user-owned PRIVATE repos — auto-off while private, auto-on once the repo is public.
          attestations: ${{ !github.event.repository.private }}
