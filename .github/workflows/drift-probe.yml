# Drift Detector — standalone scope probe. The fast, side-effect-free companion to the scan:
# resolve the fleet, map what a run WILL and WON'T read, and flag blind spots — WITHOUT
# scanning, auditing, delivering, publishing, or notifying. Run it after editing drift.yml or
# when access to a new repo lands, to check scope in ~1 minute instead of a full scan cycle.
#
# This is the ONLY place probe runs in CI: the scan workflow (scan.yml) deliberately does NOT
# run it (a slow/failing side-check must never clog the core scan → deliver path — see the
# stage-separation note there), so scope holes surface here, on demand, not on the weekly run.
# Manual only; check 'enforce' to fail on an unacknowledged hole instead of just reporting.

name: drift-probe

on:
  workflow_dispatch:
    inputs:
      enforce:
        description: "Fail the run on an unacknowledged scope hole (exit 3), instead of just reporting"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: drift-probe
  cancel-in-progress: true

env:
  GITLAB_HOST: ${{ vars.GITLAB_HOST }}
  DRIFT_OPS_PATH: ${{ vars.DRIFT_OPS_PATH }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Config — required repo variables are set
        run: |
          : "${GITLAB_HOST:?set repo variable GITLAB_HOST (Settings → Variables), e.g. gitlab.example.com}"
          : "${DRIFT_OPS_PATH:?set repo variable DRIFT_OPS_PATH, e.g. group/drift-ops}"
          echo "config ✓  host=${GITLAB_HOST} · ops=${DRIFT_OPS_PATH}"

      - name: Checkout the scanner (this repo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Reachability — can GitHub reach the private GitLab?
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if curl -fsS --max-time 20 -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
               "https://${GITLAB_HOST}/api/v4/version" >/dev/null; then
            echo "GitLab reachable and token accepted ✓"
          else
            echo "::error::Cannot reach https://${GITLAB_HOST} from GitHub runners, or the token was rejected."
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        # No ast-grep engine here — probe resolves + parses manifests + walks files for the
        # language census; it never runs the scan engine, so this stays deliberately minimal.
        run: pip install --quiet --no-cache-dir pyyaml

      - name: Clone drift-ops (fleet config)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://oauth2:${GITLAB_TOKEN}@${GITLAB_HOST}/${DRIFT_OPS_PATH}.git" drift-ops

      - name: Probe — resolve the fleet + map scope
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          DRIFT_CATALOG_DIR: ${{ github.workspace }}/drift-ops/catalog
        run: |
          set +e
          python3 -m agent.cli probe --config drift-ops/config/drift.yml --state drift-ops/state \
            --summary-md "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          case "$code" in
            0) echo "scope clean ✓" ;;
            2|4) echo "::error::probe could not resolve the fleet (exit $code)"; exit "$code" ;;
            3) if [ "${{ inputs.enforce }}" = "true" ]; then
                 echo "::error::unacknowledged scope blind spots — add the repo(s) to the fleet, or acknowledge in drift.yml probe.accept (with a reason)"; exit 3
               fi
               echo "::warning::probe found scope blind spots (report-only — re-run with 'enforce' checked to fail on them)" ;;
            *) echo "::error::probe exited unexpectedly ($code)"; exit "$code" ;;
          esac
