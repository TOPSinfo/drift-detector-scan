# Run the test suite on every PR and every push to master — the merge gate.
#
# Most of the suite is hermetic (tests/astgrep_fake.py injects the engine), but a few integration
# tests (e.g. test_zero_repos_is_not_clean) run the REAL scan path, so CI installs the pinned
# ast-grep engine — the same version bin/drift-scan fetches, so CI scans as production does. The
# suite runs the no-internal-identifiers guard (tests/test_no_internal_identifiers.py) — the
# invariant that keeps the public tree free of the internal host and client repo names — on every
# change, so a leak can never merge.
name: ci

on:
  pull_request: {}
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test deps + the pinned scan engine
        # ast-grep-cli ships the same binary bin/drift-scan fetches; pin the SAME version
        # (AST_GREP_VERSION in bin/drift-scan) so the integration tests scan byte-identically.
        run: python -m pip install -q pytest "PyYAML>=6.0" jsonschema "ast-grep-cli==0.44.1"

      # The client-identifier guard (tests/test_no_internal_identifiers.py) SKIPS when
      # DRIFT_INTERNAL_IDS is unset. That is right for a fork or a public checkout — the
      # deny-list names the client namespaces, so it must not live in this public tree — but
      # it was also true HERE, which meant the step below claimed to run a guard that was
      # silently doing nothing. That guard exists because those identifiers once reached a
      # public mirror. Fail loudly rather than skip quietly.
      - name: The client-identifier guard must actually run on this repo
        if: github.repository == 'TOPSinfo/drift-detector-scan'
        env:
          DRIFT_INTERNAL_IDS: ${{ secrets.DRIFT_INTERNAL_IDS }}
        run: |
          if [ -z "$DRIFT_INTERNAL_IDS" ]; then
            echo "::error::DRIFT_INTERNAL_IDS is not set, so tests/test_no_internal_identifiers.py is SKIPPING — nothing is checking this tree for client repo names or the internal host. Add it as a repository secret (a single |-joined regex)."
            exit 1
          fi
          echo "guard armed"

      - name: Run tests (incl. the no-internal-identifiers guard)
        env:
          DRIFT_INTERNAL_IDS: ${{ secrets.DRIFT_INTERNAL_IDS }}
        run: python -m pytest -q
