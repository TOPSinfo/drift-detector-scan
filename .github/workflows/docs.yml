# Build and publish the documentation site to GitHub Pages.
#
# Docs-only: this never touches the scan path. mkdocs-material lives in requirements-docs.txt,
# separate from the runtime (stdlib + PyYAML) and test dependencies, so a docs build can never
# add weight to what a user installs.
#
# ONE-TIME SETUP: Settings -> Pages -> Source = "GitHub Actions". Without that the deploy step
# fails with a 404 on the Pages API.
name: docs

on:
  push:
    branches: [master]
    paths: ['docs/**', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/docs.yml']
  workflow_dispatch: {}

# Least privilege: only the deploy job may write Pages, and only via the OIDC id-token.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r requirements-docs.txt
      # --strict turns a broken internal link or a bad nav entry into a build FAILURE rather
      # than a warning nobody reads. A docs site that quietly loses a page is the same class of
      # problem as a scan that quietly loses a finding.
      - run: mkdocs build --strict
      # Inlined from actions/upload-pages-artifact@v3 rather than calling it. That action is
      # COMPOSITE and its final step calls `actions/upload-artifact@v4` — an unpinned TAG —
      # which this org's "all actions must be pinned to a full-length commit SHA" policy
      # rejects transitively: the run fails at Set up job before any step executes. Pinning our
      # own four actions was not enough, because the violation is inside someone else's action.
      # These two steps are exactly its Linux branch (the runner is ubuntu-latest).
      # The artifact name MUST stay `github-pages` — that is what deploy-pages looks for.
      - name: Archive the site as a Pages artifact
        run: |
          tar --dereference --hard-dereference \
              --directory site \
              -cvf "$RUNNER_TEMP/artifact.tar" \
              --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
