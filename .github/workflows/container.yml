# Build and publish the deterministic, no-AI SCAN container to GHCR.
#
# The image is built FROM this public repo, so the GHCR image is just a build artifact of
# code anyone can read. Make the package PUBLIC once in the repo's Packages settings so
# GitLab CI can pull it with no cross-vendor pull secret. Every push is tagged by version
# AND by commit sha; consumers pin by DIGEST (see docs/CONTAINER.md).
#
# Supply chain: every third-party action is pinned to a full commit SHA (a mutable `@v3` tag
# can be repointed at malicious code), and each pushed image gets a SLSA build-provenance
# attestation in GitHub's store — verify with `gh attestation verify oci://<image@digest>`.
name: container

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write        # keyless signing identity for the provenance attestation
  attestations: write    # write the attestation to GitHub's attestation store

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262            # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9         # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags + labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051      # v5
        with:
          images: ghcr.io/TOPSinfo/drift-detector-scan
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8    # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false          # single-arch image; GH attestation below carries provenance

      - name: Attest build provenance
        # GitHub attestations are unavailable for user-owned PRIVATE repos — auto-skipped while
        # private (the image still pushes), auto-runs once the repo is public.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-name: ghcr.io/TOPSinfo/drift-detector-scan
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
