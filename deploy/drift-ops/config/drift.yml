# Drift Detector — operational config (the ONE settings file). Edit for YOUR fleet.
# Lives in the PRIVATE drift-ops repo, so client repo names never touch the public plugin.
version: 1

# Repos/groups to scan — https URLs, all under one host (a group URL scans every repo under it).
fleet:
  - https://git.example.com/team/service-a
  - https://git.example.com/team/service-b

delivery:
  mode: dry-run              # dry-run (print the plan, write nothing) | create (file issues) | off
                             # the template ships dry-run — a copy can't file issues until you opt in
  # Each flagged repo gets up to TWO comprehensive issues, filed IN THE REPO'S OWN tracker:
  #   • a DevOps issue    (package CVEs + runtime EOL)  — labelled drift:devops
  #   • a Developer issue (vendor sunsets + framework EOL) — labelled drift:developer
  # Assignee + label mean a GitLab group board (or "issues assigned to <account>") aggregates
  # every DevOps issue across the fleet — no central project needed for findings.
  devops:
    assignee: ops-bot        # the DevOps account every DevOps issue is assigned to.
                             # REQUIRED whenever mode files issues (create/live).
    project: team/ops        # where the MAINTAINER streams below (shape/freshness) are filed
  developer:
    fallbackAssignee: tech-lead   # a Developer issue auto-assigns to the repo's owner; this is
                                  # used only when the owner can't be resolved from GitLab
  shape_stream: false        # true → file a maintainer "absorption needed" issue per UNKNOWN
                             # repo (a shape the scanner can't fully read). Opt in once the
                             # fleet is stable; closes itself when the repo goes KNOWN.

# scan: is entirely optional — a persistent alternative to typing `run`'s own flags on every
# invocation. Every key here defaults to the flag's own default when omitted, and an explicit
# CLI flag on a given invocation always overrides whatever this says for THAT run.
#
# scan:
#   only: [secrets]           # scan just this subset of {secrets, cve, sunsets} by default —
#                              # e.g. a fleet that wants a fast secrets-only pass every run.
#                              # Omit to scan everything (today's default). A skipped category
#                              # is never silently "clean": it shows in coverage.categoriesSkipped
#                              # and as a banner on the dashboard, every run this is set.
#   jobs: 4                   # scan this many repos concurrently (default: 1 = serial — what
#                              # CI runs unless you raise this; capped to the machine's CPU count).
#   engine_threads: 2         # cap ast-grep's OWN internal thread pool per repo (default: ast-grep's
#                              # own default = every logical CPU for one repo's scan). Lower this on a
#                              # small/shared runner — several repos' scans at once can otherwise
#                              # exhaust host memory even at jobs: 1.
#   pull: true                 # `git pull` each already-cloned repo before scanning (default: false,
#                              # scan whatever is already checked out).
#   fail_on_deprecated: true  # exit non-zero (3) when any CVE/EOL finding is open — for a CI
#                              # pipeline that wants a red/green build signal on top of (or
#                              # instead of) filed issues. CAUTION if this job ALSO runs
#                              # sbom/sarif/verify/deliver/state-persist as later lines in the
#                              # SAME CI job: a non-zero exit here stops the job before those
#                              # later lines run. Fine for a merge-gate CI that only runs `run`;
#                              # for a scan-then-deliver pipeline like this template's, either
#                              # leave this off or restructure so delivery/persistence happen
#                              # BEFORE the gated step.
#   fail_on_exposed: true     # same caution, for exit code 7 when any EXPOSED secret is open.

# auth + notify hold env-var NAMES, never secrets (this file is git-tracked and reviewed).
# Omit `auth` entirely to run on a single GITLAB_TOKEN, as below by default:
#
# auth:
#   clone:   GITLAB_TOKEN     # read the fleet + drift-ops
#   persist: GITLAB_TOKEN     # push state/overlay back to drift-ops
#   deliver: GITLAB_TOKEN     # file issues / open MRs   (split to a Developer token for `mrs`)
#
# notify:
#   gchat: GCHAT_WEBHOOK      # env var holding the Google Chat webhook; omit for no push
